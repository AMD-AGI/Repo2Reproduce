[project]
name = "repo2reproduce"
version = "0.1.0"
description = "Read a research paper + its GitHub code, choose the right experiment, extract the exact configuration, and synthesize grounded commands to replicate the result."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Repo2Reproduce" }]

dependencies = [
    # Claude Agent SDK (isolated phase workers, structured output, custom MCP tools, hooks)
    # 0.2.136+ includes the lifecycle/structured-result fixes required by phase workers.
    "claude-agent-sdk>=0.2.136",
    # --- Strict paper-reading layer (OpenDataLoader PDF ONLY; Java-based, no torch) ---
    "opendataloader-pdf>=2.4.0",
    # Ingestion / utilities
    "httpx>=0.27",
    "gitpython>=3.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
r2r = "repo2reproduce.cli:app"
claude-baseline-two-stage = "claude_baseline_two_stage.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["repo2reproduce", "claude_baseline_two_stage"]

[tool.ruff]
line-length = 100
target-version = "py310"
